# Configuration of the PGindexAI daemon
# Default location: ~/.config/PGindexAI/PGindexAI.yaml
# Recommended permissions: 0600 (the file may contain a password)

postgresql:
  host: "/var/run/postgresql"  # Local Unix socket — or "127.0.0.1" / hostname for TCP
  port: 5432
  user: "pgindexai"             # Dedicated non-superuser role (see install.sh)
  database: "pgindexai_demo"
  password: ""                 # Required if pg_hba.conf requires scram-sha-256 / md5
  ssl_mode: "disable"          # disable | require | verify-ca | verify-full
                               # (TLS not applicable on Unix socket → disable)
  # ssl_root_cert: ""          # PEM path of a self-signed CA (snakeoil, internal)
                               # for verify-ca / verify-full. Without this key,
                               # only the web PKI (Mozilla) roots are accepted.

laya:
  url: "http://127.0.0.1:8080"
  timeout_seconds: 30

# Control of DDL actions — set to false to disable an action
actions:
  create_index: true
  drop_unused: true
  rebuild_fragmented: true

# Decision thresholds
thresholds:
  cycle_seconds: 60        # Analysis cycle frequency (1..=86400)
  unused_minutes: 10080    # Observation window (default 7 days) before DROP
                           # of an unused index — the counters are reset on
                           # PG restart: do not go too low.
  fragmentation_pct: 70    # % of fragmentation triggering a REINDEX CONCURRENTLY (1..=100)
  use_index_bloat: true    # Physical bloat detection via pgstattuple (leaf fill
                           # measured on indexes > 100 pages — one full index scan
                           # per index). false = legacy heuristic only (blind to
                           # bloat left by VACUUM). Requires: CREATE EXTENSION
                           # pgstattuple + superuser or pg_stat_scan_tables.
  use_gin_gist_detection: true  # Detect GIN/GIST index needs (jsonb/hstore/
                                # arrays/tsvector → GIN, geometry/ranges → GIST).
                                # false = B-tree proposals only (classic scalar
                                # SARGable patterns).
  min_sargable_rows: 100   # Min. executions (pg_stat_statements.calls) for a
                           # query to be a candidate for a SARGable index (>= 1)
  min_confidence: 0.7      # Minimum Laya confidence to apply (0.0..=1.0)
  max_proposals_per_cycle: 20  # Proposal budget per cycle (1..=1000)
  ddl_timeout_seconds: 1800  # Timeout of long CONCURRENTLY DDL, in seconds
                             # (0 = unlimited; 0..=86400 — keep generous: a
                             # too-short timeout on a large table would create a
                             # build→cancelled→retry loop)

# Analysis scope (multi-schema)
analysis:
  # List of schemas to analyze.
  # - empty list = all non-system schemas (default)
  # - example: ["public", "billing"]
  schemas: []

# PostgreSQL connection pool
pg_pool:
  max_size: 16                # Maximum pool size (1..=512)
  wait_timeout_ms: 30000      # Connection wait timeout (100..=600000)

# Target density per column type (tuples/page targeted, index size estimation)
density_by_type:
  int4: 200        # integer
  int8: 200        # bigint
  float8: 150      # double precision, numeric, real
  varchar: 30      # character varying
  text: 20         # text
  date: 150        # date
  timestamptz: 150 # timestamp (with/without time zone)
  uuid: 100        # uuid
  bool: 300        # boolean
  default_density: 50  # any other type
  # Size factors applied to the GIN/GIST index-size estimate (a GIN index is
  # typically ~3× a B-tree, a GIST ~2× — per-value posting lists / R-tree pages).
  gin_size_factor: 3.0     # multiplicative factor for GIN size estimate (> 0)
  gist_size_factor: 2.0    # multiplicative factor for GIST size estimate (> 0)

# Logging
logging:
  level: "info"
  format: "json"   # json | text

# History of index operations (0640 file, rotation included)
index_logging:
  enabled: true
  # Verbosity levels:
  #   minimal  → timestamp, CRUD type, duration, schema, object name
  #   standard → + DDL of the modified index (+ index method: btree/gin/gist)
  #   verbose  → + detailed reason
  verbosity: "minimal"
  # Log file (if empty → stdout only)
  log_file: "/var/log/pgindexai/index_operations.log"
  # Rotation (in bytes, 0 = disabled)
  max_file_size_bytes: 10485760  # 10 MB
  max_files: 5
